<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbeitszeit</title><style>
body{font-family:-apple-system,system-ui;background:#f2f2f7;max-width:700px;margin:auto;padding:18px 14px;color:#111}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.day,.wk{padding:13px 0;border-bottom:1px solid #eee}.times{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}input,select{font:inherit;padding:9px;border:0;border-radius:10px;background:#eee}button{font:inherit;font-weight:600;padding:9px;border:0;border-radius:10px;background:#111;color:#fff}.gray{background:#ddd;color:#111}.muted{font-size:13px;color:#777}.pos{color:green}.neg{color:#c22}</style></head><body>
<h1>Arbeitszeit</h1><div class=muted>Mo–Do 8:00 h · Fr 5:00 h · 37:00 h/Woche</div><h2>Diese Woche</h2><div class=card id=days></div><div class="card row"><b>Saldo gebuchter Tage</b><b id=cur></b></div><h2>Jahresübersicht</h2><div class=card><div class=row><b>Kalenderwochen</b><select id=year></select></div><div class="row" style="margin-top:12px"><span>Gesamtsaldo</span><b id=total></b></div><div id=weeks></div></div>
<script>
const K="az-v2",E=JSON.parse(localStorage.getItem(K)||"{}"),p=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()),hm=m=>(m<0?"−":"")+Math.floor(Math.abs(m)/60)+":"+p(Math.abs(m)%60)+" h",mm=t=>{let a=t.split(":").map(Number);return a[0]*60+a[1]},target=k=>{let d=new Date(k+"T12:00").getDay();return d<5?480:d==5?300:0};
function calc(s,e){let g=mm(e)-mm(s);if(g<0)g+=1440;let q=g>360?45:15;return[n=Math.max(0,g-q),q]}
function mon(d=new Date()){d=new Date(d);let n=d.getDay()||7;d.setHours(12);d.setDate(d.getDate()-n+1);return d}
function save(k){let s=document.getElementById("s"+k).value,e=document.getElementById("e"+k).value,[n,q]=calc(s,e);E[k]={s,e,n,q};localStorage.setItem(K,JSON.stringify(E));render()}
function del(k){if(confirm("Buchung löschen?")){delete E[k];localStorage.setItem(K,JSON.stringify(E));render()}}
function renderDays(){let m=mon(),names=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"],o="",net=0,sol=0;for(let i=0;i<5;i++){let d=new Date(m);d.setDate(m.getDate()+i);let k=key(d),x=E[k],b=x?x.n-target(k):0;if(x){net+=x.n;sol+=target(k)}o+=`<div class=day><div class=row><div><b>${names[i]}</b><div class=muted>${d.toLocaleDateString("de-DE")} · Soll ${hm(target(k))}</div></div>${x?`<b class=${b>=0?"pos":"neg"}>${b>=0?"+":""}${hm(b)}</b>`:""}</div><div class=times><input type=time id=s${k} value="${x?.s||"07:00"}"><input type=time id=e${k} value="${x?.e||(i==4?"12:15":"16:00")}"><button onclick="save('${k}')">${x?"Ändern":"Buchen"}</button>${x?`<button class=gray onclick="del('${k}')">Löschen</button>`:""}</div>${x?`<div class=muted>Pause ${x.q} Min. · Netto ${hm(x.n)}</div>`:""}</div>`}days.innerHTML=o;let b=net-sol;cur.textContent=(b>=0?"+":"")+hm(b);cur.className=b>=0?"pos":"neg"}
function iw(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function wm(w,y){let d=new Date(y,0,4),n=d.getDay()||7;d.setDate(d.getDate()-n+1+(w-1)*7);d.setHours(12);return d}
function renderWeeks(){let y=+year.value,max=iw(new Date(y,11,28)),o="",all=0;for(let w=1;w<=max;w++){let m=wm(w,y),net=0,sol=0,c=0;for(let i=0;i<5;i++){let d=new Date(m);d.setDate(m.getDate()+i);let k=key(d),x=E[k];if(x){net+=x.n;sol+=target(k);c++}}let b=net-sol;if(c)all+=b;o+=`<div class=wk><div class=row><b>KW ${p(w)}</b>${c?`<span>${hm(net)} · <b class=${b>=0?"pos":"neg"}>${b>=0?"+":""}${hm(b)}</b></span>`:`<span class=muted>keine Buchungen</span>`}</div></div>`}weeks.innerHTML=o;total.textContent=(all>=0?"+":"")+hm(all);total.className=all>=0?"pos":"neg"}
function render(){renderDays();renderWeeks()}let cy=new Date().getFullYear();for(let y=cy-3;y<=cy+1;y++){let o=document.createElement("option");o.value=o.textContent=y;if(y==cy)o.selected=true;year.appendChild(o)}year.onchange=renderWeeks;render();
</script></body></html>
