<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<title>Meine Arbeitszeit</title>
<link rel="manifest" href="manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#111;background:#f4f4f6}
*{box-sizing:border-box} body{margin:0;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom));max-width:620px;margin:auto}
h1{font-size:30px;margin:22px 0 4px}.sub{color:#6e6e73;margin-bottom:18px}
.card{background:white;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 1px 4px #0000000c}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.big{font-size:30px;font-weight:750}.label{color:#6e6e73;font-size:14px}
input{font:inherit;border:0;background:#f2f2f7;padding:12px;border-radius:12px}
button{width:100%;border:0;border-radius:15px;padding:14px;font-size:17px;font-weight:650;background:#111;color:white;margin-top:10px}
button.secondary{background:#e9e9ee;color:#111}.positive{color:#16813d}.negative{color:#c62828}
.entry{padding:13px 0;border-bottom:1px solid #eee}.entry:last-child{border:0}.small{font-size:13px;color:#777}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid #ddd;padding:9px 20px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav div{font-size:12px;text-align:center} nav b{display:block;font-size:21px}
</style>
</head>
<body>
<h1>Arbeitszeit</h1>
<div class="sub" id="today"></div>

<div class="card">
  <div class="row"><div><div class="label">Kommen</div><input id="start" type="time" value="07:00"></div>
  <div><div class="label">Gehen</div><input id="end" type="time" value="16:00"></div></div>
  <button onclick="save()">Arbeitstag speichern</button>
</div>

<div class="card" id="preview"></div>

<div class="card">
 <div class="row"><div><div class="label">Diese Woche</div><div class="big" id="weekNet">0:00 h</div></div>
 <div style="text-align:right"><div class="label">Saldo</div><div class="big" id="weekBalance">0:00 h</div></div></div>
 <div class="small">Wochensoll: 37:00 h · Mo–Do 8:00 h · Fr 5:00 h</div>
</div>

<h2>Verlauf</h2>
<div class="card" id="history"></div>
<button class="secondary" onclick="clearAll()">Alle Einträge löschen</button>

<nav><div><b>◷</b>Arbeitszeit</div></nav>
<script>
const KEY="arbeitszeit-v1";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
const pad=n=>String(n).padStart(2,"0");
const hm=m=>`${m<0?"−":""}${Math.floor(Math.abs(m)/60)}:${pad(Math.abs(m)%60)} h`;
function mins(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function target(date){let d=new Date(date+"T12:00").getDay();return d>=1&&d<=4?480:d===5?300:0}
function calc(s,e){let gross=mins(e)-mins(s); if(gross<0) gross+=1440; let pause=gross>360?45:15; return {gross,pause,net:Math.max(0,gross-pause)}}
function dateKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function pretty(k){return new Date(k+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}
function preview(){
 let c=calc(start.value,end.value), t=target(dateKey()), bal=c.net-t;
 document.getElementById("preview").innerHTML=`<div class="label">Vorschau heute</div><div class="row"><div><div class="big">${hm(c.net)}</div><div class="small">Netto · Pause ${c.pause} Min.</div></div><div class="${bal>=0?"positive":"negative"} big">${bal>=0?"+":""}${hm(bal)}</div></div>`;
}
function save(){
 let date=dateKey(), c=calc(start.value,end.value);
 entries=entries.filter(x=>x.date!==date);
 entries.push({date,start:start.value,end:end.value,net:c.net,pause:c.pause});
 localStorage.setItem(KEY,JSON.stringify(entries)); render();
}
function monday(k){
 let d=new Date(k+"T12:00"), day=d.getDay()||7; d.setDate(d.getDate()-day+1); return dateKey(d)
}
function render(){
 preview();
 let mon=monday(dateKey()), md=new Date(mon+"T12:00"), sun=new Date(md); sun.setDate(md.getDate()+6);
 let w=entries.filter(x=>{let d=new Date(x.date+"T12:00");return d>=md&&d<=sun});
 let net=w.reduce((a,x)=>a+x.net,0);
 let elapsedTarget=0, now=new Date();
 for(let i=0;i<5;i++){let d=new Date(md);d.setDate(md.getDate()+i);if(d<=now)elapsedTarget+=target(dateKey(d))}
 weekNet.textContent=hm(net); let wb=net-elapsedTarget; weekBalance.textContent=(wb>=0?"+":"")+hm(wb); weekBalance.className="big "+(wb>=0?"positive":"negative");
 let sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date));
 history.innerHTML=sorted.length?sorted.map(x=>{let b=x.net-target(x.date);return `<div class="entry"><div class="row"><b>${pretty(x.date)}</b><b class="${b>=0?"positive":"negative"}">${b>=0?"+":""}${hm(b)}</b></div><div class="small">${x.start}–${x.end} · Pause ${x.pause} Min. · Netto ${hm(x.net)}</div></div>`}).join(""):"<div class='small'>Noch keine Arbeitstage gespeichert.</div>";
}
function clearAll(){if(confirm("Wirklich alle Einträge löschen?")){entries=[];localStorage.removeItem(KEY);render()}}
start.oninput=preview;end.oninput=preview;
today.textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
